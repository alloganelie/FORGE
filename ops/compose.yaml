name: forge

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - forge-db-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    environment:
      AGENT_ENVIRONMENT: local
      AGENT_ROLE: api
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    environment:
      AGENT_ENVIRONMENT: local
      AGENT_ROLE: worker
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
    depends_on:
      db:
        condition: service_healthy

volumes:
  forge-db-data:
