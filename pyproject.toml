[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forge-agent"
version = "0.1.0"
description = "Agent de production controlee de livrables - fondations (MS-0)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "hypothesis>=6.122,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/agent"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "ca(id): critere d'acceptation couvert (TT-01)",
  "spec(id): exigence, invariant, transition ou suite couverte (TT-02)",
  "tst(id): suite de tests de la specification (19.3)",
  "integration: test necessitant PostgreSQL reel",
  "property: test de propriete (Hypothesis)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend/src", "backend/tests", "tools"]
exclude = [
  "tools/spec.py",
  "tools/gen_briefs.py",
  "backend/src/agent/lifecycle/core/states.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "TID"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S311", "SIM117", "PT012", "S603"]
"tools/**" = ["T201"]
"tools/check.py" = ["S603", "S607"]
"tools/spec_trace.py" = ["E501", "S314"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/src"]
mypy_path = "backend/src"
explicit_package_bases = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]